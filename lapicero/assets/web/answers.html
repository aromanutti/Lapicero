<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="marked.min.js"></script>
<style>
  :root {
    --ink: #1C1C1E; --muted: #6B6B66; --border: #E4E4DF; --accent: #2F4FD8;
    --bubble: #F1F3FD; --code: #F4F4F1; --error: #D6453D;
  }
  html, body { margin: 0; background: #FFFFFF; }
  body {
    color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.55; padding: 14px 16px 18px;
    -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
  }
  #empty { color: var(--muted); text-align: center; margin-top: 40px; line-height: 1.6; }
  .turn { margin-bottom: 18px; }
  .question { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 10px; }
  .page { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
  .bubble {
    background: var(--bubble); border-radius: 14px 14px 4px 14px; padding: 8px 12px;
    max-width: 88%; white-space: pre-wrap;
  }
  .bubble img {
    display: block; max-width: 100%; max-height: 160px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 6px; background: #FFFFFF;
  }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer p { margin: 0 0 10px; }
  .answer h1, .answer h2, .answer h3 { font-size: 15px; margin: 14px 0 6px; }
  .answer ul, .answer ol { padding-left: 22px; margin: 0 0 10px; }
  .answer li { margin: 2px 0; }
  .answer blockquote { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .answer code {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px;
    background: var(--code); border-radius: 5px; padding: 1px 4px;
  }
  .answer pre { background: var(--code); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .answer pre code { background: none; padding: 0; }
  .answer table { border-collapse: collapse; margin: 0 0 10px; }
  .answer th, .answer td { border: 1px solid var(--border); padding: 4px 8px; }
  .answer a { color: var(--accent); }
  .answer .katex { font-size: 1.08em; }
  .answer .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .error { color: var(--error); }
  .thinking { color: var(--muted); }
  .thinking span { animation: blink 1.4s infinite both; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div id="thread"></div>
<script>
  "use strict";
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Markdown with LaTeX: $…$ / \(…\) inline, $$…$$ / \[…\] display. Code is left untouched,
  // math is rendered by KaTeX outside Markdown, and raw HTML is shown as text.
  function renderMarkdown(source) {
    const code = [], math = [];
    let text = source.replace(/```[\s\S]*?(```|$)|`[^`\n]+`/g, m => `\u0000C${code.push(m) - 1}\u0000`);
    text = text.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=\S)([^$\n]*?\S)\$(?!\d)/g,
      (m, block, bracket, paren, inline) => {
        const display = block !== undefined || bracket !== undefined;
        const tex = block ?? bracket ?? paren ?? inline;
        const html = katex.renderToString(tex, {displayMode: display, throwOnError: false});
        return `\u0000M${math.push(html) - 1}\u0000`;
      });
    text = text.split(/(\u0000C\d+\u0000)/).map(part => /^\u0000C\d+\u0000$/.test(part) ? part : part
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")).join("");
    text = text.replace(/\u0000C(\d+)\u0000/g, (m, i) => code[+i]);
    const html = marked.parse(text, {breaks: true, gfm: true});
    return html.replace(/\u0000M(\d+)\u0000/g, (m, i) => math[+i]);
  }

  function renderQuestion(text) {
    // The user's own words, shown as typed, with any math they wrote rendered.
    return escapeHtml(text).replace(/\$\$([\s\S]+?)\$\$|\$(?=\S)([^$\n]*?\S)\$(?!\d)/g, (m, block, inline) =>
      katex.renderToString((block ?? inline).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"),
                           {displayMode: block !== undefined, throwOnError: false}));
  }

  window.renderThread = function (state) {
    const thread = document.getElementById("thread");
    if (!state.turns.length) {
      thread.innerHTML = `<div id="empty">${escapeHtml(state.empty)}</div>`;
      return;
    }
    thread.innerHTML = state.turns.map(turn => {
      const image = turn.image ? `<img src="${turn.image}" alt="">` : "";
      const page = turn.page ? `<div class="page">${escapeHtml(turn.page)}</div>` : "";
      let answer;
      if (turn.answer === null) {
        answer = `<div class="thinking">${escapeHtml(state.thinking)}<span>.</span><span>.</span><span>.</span></div>`;
      } else if (turn.error) {
        answer = `<div class="error">${renderMarkdown(turn.answer)}</div>`;
      } else {
        answer = renderMarkdown(turn.answer);
      }
      return `<div class="turn"><div class="question">${page}<div class="bubble">${image}${renderQuestion(turn.question)}</div></div>` +
             `<div class="answer">${answer}</div></div>`;
    }).join("");
    window.scrollTo(0, document.body.scrollHeight);
  };
</script>
</body>
</html>
